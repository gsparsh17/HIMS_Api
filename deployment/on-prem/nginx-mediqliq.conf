# Copy to /etc/nginx/sites-available/mediqliq and replace placeholders.
server {
    listen 80;
    server_name hims.hospital.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hims.hospital.local;

    ssl_certificate     /etc/mediqliq/tls/hims.crt;
    ssl_certificate_key /etc/mediqliq/tls/hims.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/mediqliq;
    index index.html;
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ /\. {
        deny all;
    }
}
